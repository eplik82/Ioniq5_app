name: Android

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testid
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ioniq5-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      # Püsiv link uusimale APK-le:
      # https://github.com/eplik82/Ioniq5_app/releases/download/apk/ioniq5-monitor.apk
      - name: Avalda uusim APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ioniq5-monitor.apk
          NOTES="Ehitus #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk ioniq5-monitor.apk --clobber
            gh release edit apk --notes "$NOTES"
          else
            gh release create apk ioniq5-monitor.apk --title "Uusim APK" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
